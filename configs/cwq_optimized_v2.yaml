# SCN configuration preset
llm_model_name: "models/Llama-3-8B-Instruct"
llm_hidden_size: 4096

use_lora: true
lora_r: 12
lora_alpha: 24
lora_dropout: 0.1
lora_target_modules:
  - "q_proj"
  - "v_proj"

use_gradient_checkpointing: true

kge_dim: 512
kge_raw_dim: 512
fusion_type: "weighted"
fusion_lambda: 0.7

input_projector_hidden_dim: null
input_projector_dropout: 0.2
input_projector_lr: 1.0e-4

projector_hidden_dims:
  - 2048
  - 1024
projector_dropout: 0.1
projector_activation: "gelu"

temperature: 0.08
hard_negative_weight: 2.0
max_hops: 10
use_multi_path_per_pair: false
learning_rate: 1.0e-4
projector_lr: 1.0e-4
lora_lr: 1.0e-4
weight_decay: 0.01
warmup_steps: 500
max_grad_norm: 1.0
batch_size: 1
gradient_accumulation_steps: 4
num_epochs: 25

beam_size: 5
inference_temperature: 1.0

train_ratio: 0.9
train_file: "datasets/RoG-cwq-train-merged+989.jsonl"
val_file: null

log_interval: 10
val_interval: 1
save_best_only: true

kge_embeddings_dir: "kg_preprocessing/output/cwq_kge_model_rotate_latest/embeddings"
kge_mapping_dir: "kg_preprocessing/output/cwq_kge_model_rotate_latest/trained_model/training_triples"
output_dir: "./output/scn_cwq_optimized_v2"
